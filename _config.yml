title: The Ember Room
markdown: kramdown
kramdown:
  input: GFM
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: "pages"
    values:
      layout: page
      permalink: /:basename.html
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /journal/:title/
