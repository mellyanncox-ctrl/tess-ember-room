# Questions on the Fees & FAQ page, in order.
questions:
  - question: "How do I know if I need it?"
    answer: "<p>You don't need a crisis to justify going. If you're constantly stressed, stuck in the same patterns, snapping at people you love, avoiding things that matter, or just feel “off” and can't name why, that's enough.</p><p>Therapy isn't only for trauma or breakdowns. It's for anyone who wants to understand themselves better, build better habits, or just have a space that's fully theirs.</p>"
  - question: "How long does it take to work?"
    answer: "<p>Some people feel a shift after 2-3 sessions from finally being seen &amp; heard. But real, lasting change usually takes months, not weeks.</p><p>There's no finish line, but research suggests noticeable improvement for many people happens somewhere between 8 and 20 sessions, depending on what you're working through.</p><p>Like a gym session, you don’t expect ‘results’ instantly, they accumulate over time, but you certainly can feel better right away!</p>"
  - question: "How often do I need to go?"
    answer: "<p>Fortnightly (every 2 weeks) is the ideal starting point, especially early on – it builds momentum, familiarity, and safety, while giving enough time to work independently between sessions.</p><p>If you're in crisis or working through something heavy, weekly can be better.</p><p>But, it’s entirely your call how often you want (and practically can) be there. Anything is better than nothing! So even once a month can offer significant support.</p>"
  - question: "Is online as effective?"
    answer: "<p>Multiple studies have found online sessions can be just as effective as in-person for most people. What matters more is the connection you have with your therapist.</p><p>Online therapy removes a lot of barriers – commute time, location, mobility issues – which means more people actually show up.</p><p>I have often enjoyed being in my own space for online sessions. If you feel comfortable and understood, then the screens don't matter.</p>"
  - question: "What if I run out of things to say?"
    answer: "<p>Fortunately, I can talk plenty 😉</p><p>I jest… but in all seriousness, silence and exploring uncertainty is just as much a part of the gold as hearing about all the problems.</p><p>And the ‘I’m not sure what to talk about’ days can often end up being the most profound and powerful sessions clients have.</p>"
