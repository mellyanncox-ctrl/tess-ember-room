{%- assign sec = include.s -%}
<section class="journal-list g" aria-label="{{ sec.label | default: 'From the Journal' | escape }}">
  <div class="wrap">
    <a class="journal-card" href="{{ sec.link }}">
      <p class="cap">{{ sec.label | default: "From the Journal" }}</p>
      <h2>{{ sec.title }}</h2>
      <p class="ex">{{ sec.excerpt }}</p>
      <span class="more">{{ sec.more | default: "Read more →" }}</span>
    </a>
  </div>
</section>
