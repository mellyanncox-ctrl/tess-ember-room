{%- assign sec = include.s -%}
{%- if sec.heading_id %}{% assign hid = sec.heading_id %}{% else %}{% assign hid = "s" | append: include.n | append: "-h" %}{% endif -%}
<section data-s="{{ include.n | minus: 1 }}" class="poster split clean{% if sec.photo_right != true %} flip{% endif %} g"{% if sec.anchor %} id="{{ sec.anchor }}"{% endif %} aria-labelledby="{{ hid }}">
  <img class="photo" src="{{ sec.photo }}"{% if sec.photo_width %} width="{{ sec.photo_width }}" height="{{ sec.photo_height }}"{% endif %} loading="lazy" alt="{{ sec.photo_alt }}" data-ei="photo">
  <div class="tint"></div><div class="grain"></div>
  <div class="in">
    <div class="panel">
      {% if sec.heading %}<h2 id="{{ hid }}" data-e="heading">{% include fill.html t=sec.heading %}</h2>{% endif %}
      <div class="prose split-prose" data-e="text" data-et="rich">
      {% include fill.html t=sec.text %}
    </div>
    </div>
  </div>
</section>
