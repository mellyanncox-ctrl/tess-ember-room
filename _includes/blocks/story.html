{%- assign sec = include.s -%}
{%- if sec.heading_id %}{% assign hid = sec.heading_id %}{% else %}{% assign hid = "s" | append: include.n | append: "-h" %}{% endif -%}
<section class="poster split clean{% if sec.photo_right != true %} flip{% endif %} g"{% if sec.anchor %} id="{{ sec.anchor }}"{% endif %} aria-labelledby="{{ hid }}">
  <img class="photo" src="{{ sec.photo }}"{% if sec.photo_width %} width="{{ sec.photo_width }}" height="{{ sec.photo_height }}"{% endif %} loading="lazy" alt="{{ sec.photo_alt }}">
  <div class="tint"></div><div class="grain"></div>
  <div class="in">
    <div class="panel">
      <h2 id="{{ hid }}">{% include fill.html t=sec.heading %}</h2>
      <div class="prose split-prose">
      {% include fill.html t=sec.text %}
    </div>
    </div>
  </div>
</section>
